name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            binary: speckit
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
            binary: speckit
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
            binary: speckit
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
            binary: speckit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            binary: speckit.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p speckit
          else
            cargo build --release --target ${{ matrix.target }} -p speckit
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speckit-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts

          # Linux x64
          tar -czf ../release/speckit-linux-x64.tar.gz -C speckit-linux-x64 speckit

          # Linux arm64
          tar -czf ../release/speckit-linux-arm64.tar.gz -C speckit-linux-arm64 speckit

          # macOS x64
          tar -czf ../release/speckit-darwin-x64.tar.gz -C speckit-darwin-x64 speckit

          # macOS arm64
          tar -czf ../release/speckit-darwin-arm64.tar.gz -C speckit-darwin-arm64 speckit

          # Windows x64
          cd speckit-win32-x64
          zip ../../release/speckit-win32-x64.zip speckit.exe
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/speckit-linux-x64.tar.gz
            release/speckit-linux-arm64.tar.gz
            release/speckit-darwin-x64.tar.gz
            release/speckit-darwin-arm64.tar.gz
            release/speckit-win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare npm packages
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Update version in all package.json files
          for pkg in npm/speckit npm/speckit-*; do
            if [ -f "$pkg/package.json" ]; then
              # Update version
              jq --arg v "$VERSION" '.version = $v' "$pkg/package.json" > tmp.json && mv tmp.json "$pkg/package.json"
            fi
          done

          # Update optionalDependencies versions in main package
          cd npm/speckit
          jq --arg v "$VERSION" '
            .optionalDependencies["@speckit/darwin-arm64"] = $v |
            .optionalDependencies["@speckit/darwin-x64"] = $v |
            .optionalDependencies["@speckit/linux-x64"] = $v |
            .optionalDependencies["@speckit/linux-arm64"] = $v |
            .optionalDependencies["@speckit/win32-x64"] = $v
          ' package.json > tmp.json && mv tmp.json package.json
          cd ../..

          # Copy binaries to npm package directories
          cp artifacts/speckit-darwin-arm64/speckit npm/speckit-darwin-arm64/
          cp artifacts/speckit-darwin-x64/speckit npm/speckit-darwin-x64/
          cp artifacts/speckit-linux-x64/speckit npm/speckit-linux-x64/
          cp artifacts/speckit-linux-arm64/speckit npm/speckit-linux-arm64/
          cp artifacts/speckit-win32-x64/speckit.exe npm/speckit-win32-x64/

          # Make binaries executable
          chmod +x npm/speckit-darwin-arm64/speckit
          chmod +x npm/speckit-darwin-x64/speckit
          chmod +x npm/speckit-linux-x64/speckit
          chmod +x npm/speckit-linux-arm64/speckit

      - name: Publish platform packages
        run: |
          cd npm
          for pkg in speckit-darwin-arm64 speckit-darwin-x64 speckit-linux-x64 speckit-linux-arm64 speckit-win32-x64; do
            echo "Publishing @speckit/$pkg..."
            npm publish "./$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: |
          cd npm/speckit
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
