name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must start with v, e.g., v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            binary: speckit
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
            binary: speckit
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
            binary: speckit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            binary: speckit.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p speckit

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p speckit

      - name: Stage release artifacts
        # Mirror the binary and schemas into a flat directory so the artifact
        # layout is predictable across upload-artifact versions. Multiple
        # upload paths with no common ancestor can otherwise place the binary
        # at an unexpected path inside the artifact, breaking the downstream
        # tar/zip/cp steps that expect `speckit` (or `speckit.exe`) and
        # `schemas/` directly under the artifact root.
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          cp -R schemas staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: speckit-${{ matrix.platform }}
          path: staging/
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Normalize: ensure tag starts with v
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin, skipping creation"
          else
            git tag "${TAG}" HEAD
            git push origin "${TAG}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts

          # Linux x64
          tar -czf ../release/speckit-linux-x64.tar.gz -C speckit-linux-x64 speckit schemas

          # macOS x64
          tar -czf ../release/speckit-darwin-x64.tar.gz -C speckit-darwin-x64 speckit schemas

          # macOS arm64
          tar -czf ../release/speckit-darwin-arm64.tar.gz -C speckit-darwin-arm64 speckit schemas

          # Windows x64
          cd speckit-win32-x64
          zip -r ../../release/speckit-win32-x64.zip speckit.exe schemas
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/speckit-linux-x64.tar.gz
            release/speckit-darwin-x64.tar.gz
            release/speckit-darwin-arm64.tar.gz
            release/speckit-win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare npm packages
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Update version in all package.json files
          for pkg in npm/speckit npm/speckit-*; do
            if [ -f "$pkg/package.json" ]; then
              # Update version
              jq --arg v "$VERSION" '.version = $v' "$pkg/package.json" > tmp.json && mv tmp.json "$pkg/package.json"
            fi
          done

          # Update optionalDependencies versions in main package
          cd npm/speckit
          jq --arg v "$VERSION" '
            .optionalDependencies["@coniferous-cmd/speckit-darwin-arm64"] = $v |
            .optionalDependencies["@coniferous-cmd/speckit-darwin-x64"] = $v |
            .optionalDependencies["@coniferous-cmd/speckit-linux-x64"] = $v |
            .optionalDependencies["@coniferous-cmd/speckit-win32-x64"] = $v
          ' package.json > tmp.json && mv tmp.json package.json
          cd ../..

          # Copy binaries to npm package directories
          cp artifacts/speckit-darwin-arm64/speckit npm/speckit-darwin-arm64/
          cp artifacts/speckit-darwin-x64/speckit npm/speckit-darwin-x64/
          cp artifacts/speckit-linux-x64/speckit npm/speckit-linux-x64/
          cp artifacts/speckit-win32-x64/speckit.exe npm/speckit-win32-x64/

          # Keep the package schemas next to each native binary so the CLI can
          # resolve built-in workflows after installation.
          for pkg in npm/speckit-darwin-arm64 npm/speckit-darwin-x64 npm/speckit-linux-x64 npm/speckit-win32-x64; do
            cp -R schemas "$pkg/"
          done

          # Make binaries executable
          chmod +x npm/speckit-darwin-arm64/speckit
          chmod +x npm/speckit-darwin-x64/speckit
          chmod +x npm/speckit-linux-x64/speckit

      - name: Verify npm auth and scope access
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "${NPM_CONFIG_USERCONFIG}"
          echo "npm whoami:"
          npm whoami
          echo "---"
          echo "Can list @coniferous-cmd packages?"
          npm access ls-packages @coniferous-cmd 2>&1 || echo "FAILED to list @coniferous-cmd"
          echo "---"
          echo "Already-published versions of @coniferous-cmd/speckit-darwin-arm64:"
          npm view @coniferous-cmd/speckit-darwin-arm64 versions --json 2>&1 || echo "FAILED to view @coniferous-cmd/speckit-darwin-arm64"

      - name: Publish platform packages
        run: |
          cd npm
          for pkg in speckit-darwin-arm64 speckit-darwin-x64 speckit-linux-x64 speckit-win32-x64; do
            echo "Publishing @coniferous-cmd/$pkg..."
            npm publish "./$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: |
          cd npm/speckit
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
