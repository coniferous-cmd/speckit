name: spec-driven
version: 1
artifacts:
  - id: proposal
    generates: proposal.md
    description: Project proposal
    template: proposal.md
  - id: specs
    generates: "specs/**/*.md"
    description: Requirements specs
    template: spec.md
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Design document
    template: design.md
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation tasks
    template: tasks.md
    requires:
      - specs
      - design